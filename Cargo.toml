[package]
name = "g7pro8k-odin-daemon"
version = "0.1.0"
edition = "2021"
description = "Safety-first root daemon and embedded companion web app for GameSir G7 Pro 8K on AYN Odin 3 Pro"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
evdev = "0.13"
libc = "0.2"
nusb = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
